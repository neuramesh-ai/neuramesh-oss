# The box link live check (scripts/e2e-cloudrun/boxlink-check.mjs): boxcli bus=200/401, a box-browser page through the
# egress proxy on the box loopback, and page and 20 MB timings through the link and the proxy against direct.
#
#   gcloud builds submit . --project=galonge-sandbox-04 --region=us-east4 \
#     --config=scripts/e2e-cloudrun/cloudbuild-box-net-probe.yaml \
#     --substitutions=_USER_ID=<owner>,_MACHINE_ID=<machine> \
#     --service-account=projects/galonge-sandbox-04/serviceAccounts/nm-e2e-builder@galonge-sandbox-04.iam.gserviceaccount.com \
#     --gcs-source-staging-dir=gs://galonge-sandbox-04-nm-e2e-source/staging
steps:
  - id: boxlink-check
    name: node:24-bookworm
    entrypoint: bash
    secretEnv: ["FLEET_SECRET", "NM_ACTOR_SECRET", "NM_RELAY_TOKEN_KEY"]
    env:
      - NM_API_URL=${_API_URL}
      - NM_RELAY_URL=${_RELAY_URL}
      - RELAY_USER_ID=${_USER_ID}
      - RELAY_MACHINE_ID=${_MACHINE_ID}
      - PROJECT=${PROJECT_ID}
    args: ["-c", "node --version && node scripts/e2e-cloudrun/boxlink-check.mjs"]
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/nm-e2e-fleet-secret/versions/latest
      env: FLEET_SECRET
    - versionName: projects/${PROJECT_ID}/secrets/nm-e2e-actor-secret/versions/latest
      env: NM_ACTOR_SECRET
    - versionName: projects/${PROJECT_ID}/secrets/nm-e2e-relay-token-key/versions/latest
      env: NM_RELAY_TOKEN_KEY
substitutions:
  _API_URL: https://nm-api-aqnc7mc2lq-uk.a.run.app
  _RELAY_URL: wss://nm-e2e-relay-aqnc7mc2lq-uk.a.run.app,wss://nm-e2e-relay-1-aqnc7mc2lq-uk.a.run.app
  _USER_ID: ""
  _MACHINE_ID: ""
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
