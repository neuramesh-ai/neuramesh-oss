# one workspace = one namespace. stamped by nm-fleet via SSA; every object carries the
# managed label the planner's delete guards key on. quotas arrive as vars so plan tiers
# stay a server-side decision, never a template edit.
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
  labels:
    neuramesh.io/managed: "true"
    neuramesh.io/workspace: ${WORKSPACE_ID}
    neuramesh.io/plan: ${PLAN}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workspace-quota
  namespace: ${NAMESPACE}
  labels:
    neuramesh.io/managed: "true"
    neuramesh.io/workspace: ${WORKSPACE_ID}
spec:
  hard:
    requests.cpu: ${QUOTA_CPU}
    requests.memory: ${QUOTA_MEMORY}
    persistentvolumeclaims: ${QUOTA_PVC_COUNT}
---
# default requests/limits for anything that forgets to say — the burst shape members get
apiVersion: v1
kind: LimitRange
metadata:
  name: workspace-defaults
  namespace: ${NAMESPACE}
  labels:
    neuramesh.io/managed: "true"
    neuramesh.io/workspace: ${WORKSPACE_ID}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 500m
        memory: 2Gi
      default:
        cpu: "4"
        memory: 8Gi
---
# nothing reaches a machine pod: no cross-namespace traffic, no relay-initiated dials.
# machines only ever dial OUT (cloud truth + relay), which egress leaves open.
# FQDN allowlists are the later hardening tier (architecture.md §5).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: ${NAMESPACE}
  labels:
    neuramesh.io/managed: "true"
    neuramesh.io/workspace: ${WORKSPACE_ID}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
