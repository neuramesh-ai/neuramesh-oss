# one machine = one statefulset (replicas 0|1) + one PVC. the token Secret
# (machine-<id>-token) is NOT stamped here: reconcile must never clobber the real token,
# so Secret creation belongs to PROVISIONING (which alone ever sees the plaintext —
# architecture.md §3.3/§4); the planner still deletes it with a removed machine.
# member machines carry vendor logins under /nm/home on the PVC; runners never do —
# BYOK keys arrive at spawn via env and are never written (architecture.md §1, §4).
# `#optional` lines vanish when their var is empty: k3d has no gVisor and no PD CSI.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: machine-${MACHINE_ID}
  namespace: ${NAMESPACE}
  labels:
    neuramesh.io/managed: "true"
    neuramesh.io/workspace: ${WORKSPACE_ID}
    neuramesh.io/machine: ${MACHINE_ID}
    neuramesh.io/kind: ${KIND}
spec:
  serviceName: machine-${MACHINE_ID}
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      neuramesh.io/machine: ${MACHINE_ID}
  template:
    metadata:
      labels:
        neuramesh.io/managed: "true"
        neuramesh.io/workspace: ${WORKSPACE_ID}
        neuramesh.io/machine: ${MACHINE_ID}
        neuramesh.io/kind: ${KIND}
    spec:
      runtimeClassName: ${RUNTIME_CLASS} #optional
      # a machine's only identity is its machine token — no serviceaccount, no GCP identity
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: machine
          image: ${IMAGE}
          # test environments (k3d, smoke) override with a sleep; empty = the image's own
          # CMD runs — nm-machined
          command: ${MACHINE_COMMAND} #optional
          env:
            - name: NM_MACHINE_ID
              value: ${MACHINE_ID}
            - name: NM_WORKSPACE_ID
              value: ${WORKSPACE_ID}
            - name: NM_MACHINE_KIND
              value: ${KIND}
            - name: NM_OWNER_USER_ID
              value: "${OWNER_USER_ID}"
            - name: NM_POWERSYNC_URL
              value: "${POWERSYNC_URL}"
            - name: NM_API_URL
              value: "${API_URL}"
            # the browser-terminal lane. EMPTY IS VALID: machined logs that it has no browser
            # terminal and carries on, which is the right behaviour anywhere no relay is
            # deployed. A machine never listens — this is a URL it dials OUT to.
            - name: NM_RELAY_URL
              value: "${RELAY_URL}"
            - name: NM_MACHINE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: machine-${MACHINE_ID}-token
                  key: token
                  # provisioning writes the Secret out-of-band; without it the pod must still
                  # START so machined can refuse loudly (kubelet would otherwise wedge silently
                  # in CreateContainerConfigError — the k3d e2e caught exactly that)
                  optional: true
          resources:
            requests:
              cpu: ${CPU}
              memory: ${MEMORY}
            limits:
              cpu: ${CPU_LIMIT}
              memory: ${MEMORY_LIMIT}
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /nm
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          neuramesh.io/managed: "true"
          neuramesh.io/workspace: ${WORKSPACE_ID}
          neuramesh.io/machine: ${MACHINE_ID}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ${STORAGE_CLASS} #optional
        resources:
          requests:
            storage: ${DISK}
