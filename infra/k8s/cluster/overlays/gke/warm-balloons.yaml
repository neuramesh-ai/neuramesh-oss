# THE WARM NODE (George, hand-applied 2026-08-30; committed 2026-09-03 so it is config, not drift).
#
# Autopilot reclaims an empty node about nine seconds after its last pod dies, so without this
# every cold start — a new workspace's first boot, a wake after the 48 h idle stop — pays node
# provisioning (~60 s) plus the PD CSI driver registering on the fresh node (~68 s, measured
# 2026-08-29). One pause pod on a gVisor node keeps that node alive; a machine pod that lands on
# it starts in seconds, and evicts the balloon (priority −10, never preempting anything itself),
# which then re-warms another node. One replica covers one zone at a time — nm-xfs is
# deliberately region-wide (storageclass-xfs.yaml), so the hit rate is a third of new
# workspaces, and the choice was made with that number in hand. Three balloons ≈ $79/mo cover
# every zone; this one ≈ $26/mo. Kept in the credits era on George's call (2026-09-03).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: nm-balloon
description: Placeholder capacity that any real workload may evict. See warm-balloons.yaml.
globalDefault: false
preemptionPolicy: Never
value: -10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nm-balloon
  namespace: nm-system
  labels:
    app: nm-balloon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nm-balloon
  template:
    metadata:
      labels:
        app: nm-balloon
    spec:
      priorityClassName: nm-balloon
      # the same runtime class as a machine pod, so the node it keeps warm is one a machine can use
      runtimeClassName: gvisor
      terminationGracePeriodSeconds: 0
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: nm-balloon
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          # the shape of a machine pod's requests, so evicting the balloon frees exactly what one needs
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 500m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65535
            runAsGroup: 65535
            capabilities:
              drop: [ALL]
