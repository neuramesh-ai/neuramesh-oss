# production shape: adds the XFS storage class (donor CoW — reflink verified in P0)
# and the in-cluster operator Deployment.
# gVisor needs no object on GKE; pods opt in via runtimeClassName (FLEET_RUNTIME_CLASS=gvisor).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - storageclass-xfs.yaml
  - fleet-deployment.yaml
  - relay-deployment.yaml
  - warm-balloons.yaml
