# the nm-fleet operator, in-cluster (P2 of the cloud-first plan lands here): polls
# control-api's desired state and reconciles workspaces/machines every tick. one replica —
# reconcile is level-triggered and idempotent, so a restart loses nothing.
#
# the ONE hand-applied input is the fleet credential (same value as Vercel's FLEET_SECRET):
#   kubectl -n nm-system create secret generic nm-fleet-secret --from-literal=token=...
# rollout.md carries the runbook. everything else here is config-as-code.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nm-fleet
  namespace: nm-system
  labels:
    neuramesh.io/system: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nm-fleet
  template:
    metadata:
      labels:
        app: nm-fleet
    spec:
      serviceAccountName: nm-fleet
      containers:
        - name: fleet
          image: us-east4-docker.pkg.dev/neuramesh-prd/nm/fleet:latest
          # :latest + Always is the v1 rollout knob: fleet-image.yml pushes then restarts
          # this deployment. pin to a sha tag when the canary ring lands.
          imagePullPolicy: Always
          env:
            - name: FLEET_DESIRED_URL
              value: https://api.neuramesh.app/internal/fleet-desired
            - name: FLEET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nm-fleet-secret
                  key: token
            - name: FLEET_STORAGE_CLASS
              value: nm-xfs
            - name: FLEET_RUNTIME_CLASS
              value: gvisor
            # PINNED TO A COMMIT, never `:latest` (2026-08-29). This one line is what makes a
            # fleet upgrade possible at all.
            #
            # With `:latest` the operator wrote the SAME StatefulSet spec on every pass, so
            # Kubernetes saw no diff and never rolled a pod. A workspace picked up new daemon code
            # only when it happened to cold-start, and nothing anywhere recorded which build it was
            # on — a long-running machine could drift arbitrarily far behind main, silently.
            #
            # A pinned tag changes the spec, and a changed pod template is what a StatefulSet
            # rolls. So: bump this line, merge, and fleet-deploy's `kubectl apply` hands every
            # workspace the new image. `pnpm fleet:pin` writes it for you.
            - name: FLEET_MACHINE_IMAGE
              value: us-east4-docker.pkg.dev/neuramesh-prd/nm/machine:2daf3ec011cfbd27eedbfa4321af9789ba9d258a
            # the browser-terminal lane the operator stamps onto every machine pod. Points at
            # the Gateway in this same cluster, but goes out through the public name because the
            # machine authenticates to the relay exactly as a browser's peer does — one code
            # path, one certificate, no in-cluster special case to drift.
            - name: FLEET_RELAY_URL
              value: wss://relay.neuramesh.app
            - name: FLEET_POWERSYNC_URL
              value: https://6a2b06ebdeeddd0df6040a26.powersync.journeyapps.com
            - name: FLEET_API_URL
              value: https://api.neuramesh.app
            - name: FLEET_INTERVAL_MS
              value: "10000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
