# nm-relay — the WSS hub that joins a browser to its machine (plan §3.5).
#
# ────────────────────────────────────────────────────────────────────────────────────────
# EXACTLY ONE REPLICA, AND THIS IS NOT A COST DECISION.
#
# The hub's routing tables (`machines`, `attached`, `owners` in hub.ts) are IN-MEMORY and
# per-process. A machine dials in and lands on one pod; a browser attaches and lands on
# another; with two replicas those two are in different processes and can never find each
# other. The failure is not an error — the client simply gets MACHINE_OFFLINE (4404) for a
# machine that is demonstrably online, which reads as a machine bug and is not one.
#
# So: replicas 1, and maxSurge 0 so a rollout never briefly runs two. Scaling this needs a
# shared bus or consistent hashing by machineId, not a bigger number here. The hub was
# built to restart freely instead — machines redial, and the takeover path (CLOSE.TAKEOVER)
# exists precisely so a reconnect displaces its own stale socket.
# ────────────────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nm-relay
  namespace: nm-system
  labels: { app: nm-relay }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: nm-relay }
  template:
    metadata:
      labels: { app: nm-relay }
    spec:
      containers:
        - name: relay
          image: us-east4-docker.pkg.dev/neuramesh-prd/nm/relay:latest
          imagePullPolicy: Always
          ports:
            - { name: ws, containerPort: 8787 }
          env:
            - { name: PORT, value: "8787" }
            - { name: NM_API_URL, value: "https://api.neuramesh.app" }
            # hand-applied Secret, never template-stamped — same contract as nm-fleet-secret
            # (rollout.md). The relay is useless without it: control-api 403s every validate,
            # so both edges close on VALIDATE_UNAVAILABLE rather than letting anyone through.
            - name: RELAY_SECRET
              valueFrom:
                secretKeyRef: { name: nm-relay-secret, key: RELAY_SECRET }
          # /healthz reports the live edge counts, so a probe failure means the process is
          # wedged rather than merely idle
          readinessProbe:
            httpGet: { path: /healthz, port: ws }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: ws }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # explicit uid: runAsNonRoot alone makes the kubelet verify the image's user is not
            # root, and it cannot do that for a NAME. Without this the pod sits in
            # CreateContainerConfigError forever. 1000 is `node` in the base image.
            runAsUser: 1000
            runAsGroup: 1000
            capabilities: { drop: ["ALL"] }
      # frames in flight are a person's terminal; give the pod a moment to close sockets
      # with a real code instead of having them vanish
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: nm-relay
  namespace: nm-system
  labels: { app: nm-relay }
spec:
  type: ClusterIP
  selector: { app: nm-relay }
  ports:
    - { name: ws, port: 80, targetPort: ws, protocol: TCP }
---
# WITHOUT THIS, EVERY TERMINAL DIES AT 30 SECONDS.
#
# A Google L7 load balancer's default backend timeout is 30s. For a request/response
# backend that is generous; for a WebSocket it is a hard cap on the life of the connection,
# so an idle terminal would drop about half a minute in and reconnect forever. The timeout
# is raised here rather than papered over with client-side keepalives.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: nm-relay-ws
  namespace: nm-system
spec:
  targetRef:
    group: ""
    kind: Service
    name: nm-relay
  default:
    # 1 hour. Long enough that a working session is never cut, short enough that a truly
    # abandoned socket is eventually reclaimed.
    timeoutSec: 3600
