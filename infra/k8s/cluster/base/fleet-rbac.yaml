# nm-fleet's authority, spelled out: exactly the objects it stamps, nothing more.
# no pods/exec, no logs, no secrets outside creation — the platform's reach into
# member machines stays break-glass-by-policy, not ambient-by-RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nm-fleet
  namespace: nm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nm-fleet
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [secrets, persistentvolumeclaims, resourcequotas, limitranges, services]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [apps]
    resources: [statefulsets, deployments]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nm-fleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nm-fleet
subjects:
  - kind: ServiceAccount
    name: nm-fleet
    namespace: nm-system
