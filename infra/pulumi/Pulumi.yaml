# neuramesh cloud infrastructure — pulumi YAML runtime (config-as-code, applied by
# .github/workflows/infra.yml through WIF; bootstrap: infra/README.md).
# everything the fleet needs and nothing else: services, the Autopilot cluster,
# Artifact Registry, and keyless GitHub Actions identity. in-cluster objects are NOT
# here — they live in infra/k8s and are applied by pipeline/operator.
name: neuramesh-infra
runtime: yaml
description: NeuraMesh cloud platform — GKE Autopilot fleet substrate (neuramesh-prd)

# provider project/region come from the stack file's gcp:project / gcp:region (no type
# declarations allowed on provider-namespaced keys); the project-namespaced twins below
# exist so resources can interpolate them.
config:
  project:
    type: string
  region:
    type: string
  githubRepo:
    type: string

resources:
  # ---- project services -------------------------------------------------------
  svc-compute:
    type: gcp:projects:Service
    properties:
      service: compute.googleapis.com
      disableOnDestroy: false
  svc-container:
    type: gcp:projects:Service
    properties:
      service: container.googleapis.com
      disableOnDestroy: false
  svc-artifactregistry:
    type: gcp:projects:Service
    properties:
      service: artifactregistry.googleapis.com
      disableOnDestroy: false
  svc-iam:
    type: gcp:projects:Service
    properties:
      service: iam.googleapis.com
      disableOnDestroy: false
  svc-iamcredentials:
    type: gcp:projects:Service
    properties:
      service: iamcredentials.googleapis.com
      disableOnDestroy: false
  svc-sts:
    type: gcp:projects:Service
    properties:
      service: sts.googleapis.com
      disableOnDestroy: false

  # ---- the fleet cluster ------------------------------------------------------
  # Autopilot: pod-request billing, $0 compute at scale-to-zero, gVisor per pod,
  # cost allocation on so the BigQuery export carries namespace (= workspace) labels.
  cluster:
    type: gcp:container:Cluster
    properties:
      name: nm-fleet
      location: ${region}
      enableAutopilot: true
      deletionProtection: true
      releaseChannel:
        channel: REGULAR
      costManagementConfig:
        enabled: true
    options:
      dependsOn:
        - ${svc-container}
        - ${svc-compute}

  # ---- machine image home -----------------------------------------------------
  registry:
    type: gcp:artifactregistry:Repository
    properties:
      repositoryId: nm
      format: DOCKER
      location: ${region}
      description: neuramesh machine + fleet images
    options:
      dependsOn:
        - ${svc-artifactregistry}

  # ---- keyless CI identity (WIF) ---------------------------------------------
  # no long-lived keys anywhere: GitHub Actions exchanges its OIDC token for the
  # deployer SA, scoped to exactly one repository.
  github-pool:
    type: gcp:iam:WorkloadIdentityPool
    properties:
      workloadIdentityPoolId: github
      displayName: GitHub Actions
    options:
      dependsOn:
        - ${svc-iam}
  github-provider:
    type: gcp:iam:WorkloadIdentityPoolProvider
    properties:
      workloadIdentityPoolId: ${github-pool.workloadIdentityPoolId}
      workloadIdentityPoolProviderId: github-oidc
      displayName: GitHub OIDC
      attributeMapping:
        google.subject: assertion.sub
        attribute.repository: assertion.repository
      attributeCondition: assertion.repository == "${githubRepo}"
      oidc:
        issuerUri: https://token.actions.githubusercontent.com

  infra-deployer:
    type: gcp:serviceaccount:Account
    properties:
      accountId: infra-deployer
      displayName: infra deployer (GitHub Actions via WIF)
  image-pusher:
    type: gcp:serviceaccount:Account
    properties:
      accountId: image-pusher
      displayName: machine-image pusher (GitHub Actions via WIF)

  # the repo's workflows may impersonate the two SAs — nothing and nobody else
  deployer-wif:
    type: gcp:serviceaccount:IAMMember
    properties:
      serviceAccountId: ${infra-deployer.name}
      role: roles/iam.workloadIdentityUser
      member: principalSet://iam.googleapis.com/${github-pool.name}/attribute.repository/${githubRepo}
  pusher-wif:
    type: gcp:serviceaccount:IAMMember
    properties:
      serviceAccountId: ${image-pusher.name}
      role: roles/iam.workloadIdentityUser
      member: principalSet://iam.googleapis.com/${github-pool.name}/attribute.repository/${githubRepo}

  # deployer roles — broad-ish for a solo-founder v1 (it manages cluster + registry +
  # this very stack); trim when a second human joins. pusher gets write and nothing else.
  deployer-container:
    type: gcp:projects:IAMMember
    properties:
      project: ${project}
      role: roles/container.admin
      member: serviceAccount:${infra-deployer.email}
  deployer-registry:
    type: gcp:projects:IAMMember
    properties:
      project: ${project}
      role: roles/artifactregistry.admin
      member: serviceAccount:${infra-deployer.email}
  deployer-serviceusage:
    type: gcp:projects:IAMMember
    properties:
      project: ${project}
      role: roles/serviceusage.serviceUsageAdmin
      member: serviceAccount:${infra-deployer.email}
  pusher-registry:
    type: gcp:projects:IAMMember
    properties:
      project: ${project}
      role: roles/artifactregistry.writer
      member: serviceAccount:${image-pusher.email}

  # Autopilot nodes pull machine images as the default compute SA — which in this project
  # has NO automatic roles (first live probe died on ImagePullBackOff). reader on the
  # project's registries is the one grant nodes need.
  nodes-ar-reader:
    type: gcp:projects:IAMMember
    properties:
      project: ${project}
      role: roles/artifactregistry.reader
      member: serviceAccount:486445158441-compute@developer.gserviceaccount.com

  # the pipeline owns this very stack, so the deployer needs: the state bucket (first CI
  # run failed exactly here — storage.objects.list denied), project-wide read for preview
  # refresh, and IAM admin to apply the stack's own SAs/bindings on merges.
  deployer-state-bucket:
    type: gcp:storage:BucketIAMMember
    properties:
      bucket: ${project}-pulumi-state # the bootstrap bucket, infra/README.md step 1
      role: roles/storage.objectAdmin
      member: serviceAccount:${infra-deployer.email}
  deployer-viewer:
    type: gcp:projects:IAMMember
    properties:
      project: ${project}
      role: roles/viewer
      member: serviceAccount:${infra-deployer.email}
  deployer-wif-admin:
    type: gcp:projects:IAMMember
    properties:
      project: ${project}
      role: roles/iam.workloadIdentityPoolAdmin
      member: serviceAccount:${infra-deployer.email}
  deployer-sa-admin:
    type: gcp:projects:IAMMember
    properties:
      project: ${project}
      role: roles/iam.serviceAccountAdmin
      member: serviceAccount:${infra-deployer.email}
  deployer-project-iam:
    type: gcp:projects:IAMMember
    properties:
      project: ${project}
      role: roles/resourcemanager.projectIamAdmin
      member: serviceAccount:${infra-deployer.email}

outputs:
  clusterName: ${cluster.name}
  clusterLocation: ${cluster.location}
  registryUrl: ${region}-docker.pkg.dev/${project}/${registry.repositoryId}
  wifProvider: ${github-provider.name}
  deployerEmail: ${infra-deployer.email}
  pusherEmail: ${image-pusher.email}
