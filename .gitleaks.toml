# gitleaks config for scripts/public-scan.sh. The default rules apply. The allowlist below names
# the places that hold FAKE secrets on purpose, each with its reason. Add an entry only with one.
[extend]
useDefault = true

[[allowlists]]
description = "the secret scanner's own fixtures and shell variables, not values"
paths = [
  # the sandbox secret scanner's test: a fake GitHub PAT and a fake Stripe key the test must catch
  '''apps/desktop/src/main/sandbox/secrets\.test\.ts$''',
]
regexes = [
  # fleet-local.sh probes the issuer with a fake machine token, `Bearer nmm_probe`, to read the status code
  '''^nmm_probe$''',
  # a shell variable in a curl header (`-H "authorization: Bearer $FLEET_SECRET"`) is a name, not a value
  '''Bearer \$\{?[A-Za-z_][A-Za-z0-9_]*''',
  # the video registry's model keys (`key: 'kling-3.0-pro'`, packages/control-api/src/video-registry.ts
  # and its bundle) are vendor-version names, never values: the generic rule reads `key:` plus entropy
  '''^(seedance|kling|minimax|wan|veo|hailuo)-[0-9]+(\.[0-9]+)?(-[a-z0-9]+)*$''',
]

[[allowlists]]
description = "recorded test command flag; the generic rule joins control-api and the following command line"
condition = "AND"
paths = [
  '''^docs/design/mobile-brain-coding-2026-10/evidence/(api-suite|workspace-check-pass)\.txt$''',
  # the same literal flag was retained in the October 11 hook summary's Git history
  '''^docs/design/mobile-brain-coding-2026-10/evidence/production-gates/workspace-check-summary\.txt$''',
]
regexes = ['''^NM_ALLOW_ACTOR_HEADER=1$''']

[[allowlists]]
description = "Paper validation records the SHA-256 of tokens.css at 24db9fe5, not a credential"
condition = "AND"
paths = ['''^docs/design/paper-look-2026-10/evidence/web/validation-summary\.json$''']
regexes = ['''^f3ea328f3165b63aad09530a2cff7d6fae29960dfc99d82ddb70a9674e2388b4$''']

[[allowlists]]
description = "Synthetic MCP secret in the fake sandbox argv/config secret-hiding test; exact fixture line only."
condition = "AND"
regexTarget = "line"
paths = ["apps/desktop/src/main/cloudrun/box\\.test\\.ts$"]
regexes = ["^\\s*const\\ config\\ =\\ 'mcp_servers\\.nm\\.env\\.NM_ORCH_SECRET=\"0123456789abcdef\"';$"]

[[allowlists]]
description = "Constant object-storage bundle key in the repository bundle tests; exact fixture line only."
condition = "AND"
regexTarget = "line"
paths = ["packages/control\\-api/src/repo\\-bundles\\.test\\.ts$"]
regexes = ["^\\s*const\\ key\\ =\\ 'fixture\\-a1b2c3d4';$"]

[[allowlists]]
description = "Pulumi KMS-wrapped state encryption keys in the named production Cloud Run stacks. Application secrets remain encrypted under secure entries."
condition = "AND"
regexTarget = "match"
paths = ['''^infra/cloudrun/(configuration|edge|foundation|jobs|runtime|schedules|source|restore|restore-payload|qualification|runtime-guard|recovery|connector-key|connector-reconnect|filesystem-rehearsal|pitr-rehearsal|object-rehearsal|workspace-rehearsal|monitoring|monitoring-delivery-test|legacy-retirement|finance)/Pulumi\.prd\.yaml$''']
regexes = ['''^encryptedkey: [A-Za-z0-9+/=]+$''']

[[allowlists]]
description = "Two recorded public Cloud Run API revision names; exact non-credential resource identifiers only."
condition = "AND"
regexTarget = "line"
paths = ['^docs/design/cloud-run-production-2026-11/evidence/(final-canary-target-guard|prewindow-target-guard)-20261109\.json$']
regexes = ['"apiRevision": "nm-cr-api-(00017-gzw|00016-98w)"']

[[allowlists]]
description = "Public Cloud Run API revision in the November 11 terminal verification receipt; exact non-credential identifier only."
condition = "AND"
regexTarget = "line"
paths = ['^docs/design/cloud-run-production-2026-11/evidence/project-terminal-20261111/verification\.json$']
regexes = ['"api": "nm-cr-api-00021-fq7"']
