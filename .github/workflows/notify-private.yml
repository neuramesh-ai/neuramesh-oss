# The other half of the mirror (sync-from-public.yml): every push to the public main tells the
# private repository to fetch it now, so a deploy never waits on the five-minute schedule. The
# tree is identical in both repositories, so the gate is the repository name. In the private
# repository this job is skipped on every mirrored push.
#
# PRIVATE_DISPATCH_TOKEN is a fine-grained PAT with Contents: read and write on alonge-dev/neuramesh
# (repository_dispatch needs the write). It is set in the PUBLIC repository's secrets.
name: notify private mirror

on:
  push:
    branches: [main]

permissions: {}

jobs:
  dispatch:
    name: dispatch public-main-updated
    if: github.repository == 'neuramesh-ai/neuramesh-oss'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::PRIVATE_DISPATCH_TOKEN is unset. The mirror picks this push up on its five-minute schedule."
            exit 0
          fi
          printf '{"event_type":"public-main-updated","client_payload":{"sha":"%s"}}' "$SHA" \
            | gh api -X POST repos/alonge-dev/neuramesh/dispatches --input -
          echo "dispatched public-main-updated for $SHA"
