# infrastructure pipeline: pulumi preview on PRs, pulumi up on main — keyless via WIF.
# until WIF exists (the one-time bootstrap in infra/README.md, then set the repo variables
# GCP_WIF_PROVIDER + GCP_DEPLOYER_SA and the PULUMI_CONFIG_PASSPHRASE secret), the loud
# `not-configured` job runs instead — a named skip, never a silent green (the v0.5.0-class
# lesson: a no-op that looks like a deploy is worse than a failure).
name: infra

on:
  # the mirror (sync-from-public.yml) dispatches this after a mirrored push: a push made with
  # GITHUB_TOKEN triggers no workflow on its own, so the mirror names the ones the changed paths ask for
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - infra/pulumi/**
      - .github/workflows/infra.yml
  pull_request:
    paths:
      - infra/pulumi/**
      - .github/workflows/infra.yml

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  not-configured:
    name: "SKIPPED — WIF not configured (see infra/README.md bootstrap)"
    if: github.repository == 'alonge-dev/neuramesh' && vars.GCP_WIF_PROVIDER == ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::warning::infra pipeline is NOT running — GCP_WIF_PROVIDER repo variable is unset."
          echo "::warning::bootstrap steps: infra/README.md. nothing was previewed or applied."

  pulumi:
    name: ${{ github.event_name == 'push' && 'pulumi up (prd)' || 'pulumi preview (prd)' }}
    if: github.repository == 'alonge-dev/neuramesh' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Pulumi ${{ github.event_name == 'push' && 'up' || 'preview' }}
        uses: pulumi/actions@v6
        with:
          command: ${{ github.event_name == 'push' && 'up' || 'preview' }}
          stack-name: prd
          work-dir: infra/pulumi
          # the state bucket is a repository variable (infra/README.md step 3), not a literal in the tree
          cloud-url: ${{ vars.PULUMI_STATE_BUCKET }}
