# Builds the control-api image the LOCAL stack runs (packages/control-api/Dockerfile) and pushes
# it to GHCR under this repository's owner. Tags: the release version on a v* tag (`0.133.0`, the
# NM_IMAGE_TAG the desktop renders into its compose file — review F7: the tag and the image exist
# together), and `main` + `sha-<short>` on main. Multi-arch, because the stack runs on Apple
# silicon and Intel Macs and on amd64 servers.
#
# THE PACKAGE STAYS PRIVATE until the public snapshot (review F10). A first push from a private
# repository creates a private package, and the U6a checklist flips it public in the same hour as
# the snapshot push. Nothing here changes visibility. The smoke (local-stack-smoke.yml) does not
# pull this image — it builds its own in the job — so it needs no package read either.
name: control-api image

on:
  push:
    branches: [main]
    tags: ['v*']
    # the paths filter is not evaluated for tag pushes, so every v* tag builds
    paths:
      - packages/control-api/**
      - packages/shared/**
      - supabase/migrations/**
      - supabase/validate/auth-shim.sql
      - dev/stack/init/98-storage.sql
      - dev/stack/init/99-publication.sql
      - dev/stack/powersync/**
      - pnpm-lock.yaml
      - .github/workflows/control-api-image.yml
  workflow_dispatch:

concurrency:
  group: control-api-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/neuramesh-control-api

jobs:
  build-push:
    name: build + push (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # repo-root context: the image carries the migrations, the auth shim, and PowerSync's config
          context: .
          file: packages/control-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
