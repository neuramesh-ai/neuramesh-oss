# builds and pushes the workspace-machine image to Artifact Registry — keyless via WIF,
# using the image-pusher SA (write-only). same loud-skip contract as infra.yml until the
# bootstrap variables exist. tags: the commit SHA always; `latest` only from main.
name: machine image

on:
  # the mirror (sync-from-public.yml) dispatches this after a mirrored push: a push made with
  # GITHUB_TOKEN triggers no workflow on its own, so the mirror names the ones the changed paths ask for
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - infra/images/machine/**
      - .github/workflows/machine-image.yml
      - apps/desktop/src/main/**
      - packages/shared/src/**
      - pnpm-lock.yaml
  pull_request:
    paths:
      - infra/images/machine/**
      - .github/workflows/machine-image.yml

concurrency:
  group: machine-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  IMAGE: us-east4-docker.pkg.dev/neuramesh-prd/nm/machine

jobs:
  not-configured:
    name: "SKIPPED — WIF not configured (see infra/README.md bootstrap)"
    if: github.repository == 'alonge-dev/neuramesh' && vars.GCP_WIF_PROVIDER == ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::warning::machine-image pipeline is NOT running — GCP_WIF_PROVIDER repo variable is unset."

  build-push:
    name: build + push ${{ github.event_name == 'pull_request' && '(sha tag only)' || '(sha + latest)' }}
    if: github.repository == 'alonge-dev/neuramesh' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF, keyless)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUSHER_SA }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-east4-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # repo-root context: the image carries the daemon (apps/desktop + workspace deps)
          context: .
          file: infra/images/machine/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.event_name == 'push' && format('{0}:latest', env.IMAGE) || '' }}

      # The image now exists but NOTHING is running it yet: the fleet pins a commit, so a new
      # build reaches workspaces only when that pin is bumped and fleet-deploy applies it. Say so
      # here, with the command, rather than leaving "it built" to be read as "it shipped".
      - name: Is the fleet still on an older build?
        if: github.event_name == 'push'
        run: node scripts/pin-machine-image.mjs --check "${{ github.sha }}" || true
