name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  FLEET_AUTOPROVISION: "off"
jobs:
  scope:
    name: scope and pipeline checks
    runs-on: ubuntu-latest
    outputs:
      ci_only: ${{ steps.scope.outputs.ci_only }}
      ci_static: ${{ steps.scope.outputs.ci_static }}
      hq_only: ${{ steps.scope.outputs.hq_only }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      validation: ${{ steps.matrix.outputs.validation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scope the checks
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f infra/cloudrun/ci/scope.py ]; then
            python3 infra/cloudrun/ci/scope.py
          else
            echo "ci_only=false" >> "$GITHUB_OUTPUT"
            echo "ci_static=false" >> "$GITHUB_OUTPUT"
          fi
          hq_only=false
          if [ "${{ github.event_name }}" = "pull_request" ] && node scripts/impact.mjs --hq-only HEAD^1 HEAD; then
            hq_only=true
          fi
          echo "hq_only=$hq_only" >> "$GITHUB_OUTPUT"
      - name: Test lane coverage and aggregate failure handling
        run: node --test scripts/ci-lanes.test.mjs
      - name: Discover test workspaces
        id: matrix
        env:
          CI_HQ_ONLY: ${{ steps.scope.outputs.hq_only }}
          CI_ONLY: ${{ steps.scope.outputs.ci_only }}
          CI_STATIC: ${{ steps.scope.outputs.ci_static }}
        run: |
          echo "matrix=$(node scripts/ci-lanes.mjs matrix)" >> "$GITHUB_OUTPUT"
          echo "validation=$(node scripts/ci-lanes.mjs validation-matrix)" >> "$GITHUB_OUTPUT"
      - name: Production infrastructure pipeline policy (no cloud credentials)
        if: github.repository == 'alonge-dev/neuramesh'
        run: |
          python3 -m unittest discover -s infra/cloudrun/ci/tests -v
          python3 infra/cloudrun/ci/contracts.py

  validation:
    name: ${{ matrix.task }}
    needs: scope
    if: needs.scope.outputs.ci_only != 'true' || needs.scope.outputs.ci_static == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.validation) }}
    env:
      CI_HQ_ONLY: ${{ needs.scope.outputs.hq_only }}
      CI_TASK: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck or build
        if: matrix.task != 'static'
        run: node scripts/ci-lanes.mjs "$CI_TASK"
      - name: Production HQ gateway and coding eval harness
        if: matrix.task == 'static'
        run: |
          if [ -f infra/images/hq/production.test.mjs ]; then
            node --test infra/images/hq/production.test.mjs
          fi
          pnpm eval:coding:test
      - name: Cloud Run migration preservation helpers
        if: matrix.task == 'static' && github.repository == 'alonge-dev/neuramesh'
        run: |
          python3 -m unittest discover -s infra/cloudrun/scripts/tests -p 'test_*.py' -v
          tests=(infra/cloudrun/scripts/tests/workspace-restore.test.mjs)
          if [ -f infra/cloudrun/scripts/tests/finance-config.test.mjs ]; then
            tests+=(infra/cloudrun/scripts/tests/finance-config.test.mjs)
          fi
          node --test "${tests[@]}"
      - name: Lint (ratchet self-test + eslint)
        if: matrix.task == 'static'
        run: node scripts/lint-ratchet.mjs --self-test && pnpm lint
      - name: Audit workspace scoping of replica queries
        if: matrix.task == 'static'
        run: node scripts/audit-workspace-scope.mjs --self-test
      - name: Self-test the pull request template check
        if: matrix.task == 'static'
        run: bash scripts/pr-template-check.sh --self-test

  tests:
    name: test (${{ matrix.lane }})
    needs: scope
    if: needs.scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: nm
          POSTGRES_DB: nm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:nm@localhost:5432/nm
      NM_ALLOW_ACTOR_HEADER: "1"
      CI_HQ_ONLY: ${{ needs.scope.outputs.hq_only }}
      CI_TEST_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux Code sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Select the real browser for integration tests
        run: |
          set -euo pipefail
          BROWSER=$(command -v google-chrome)
          "$BROWSER" --version
          echo "NM_CHROMIUM=$BROWSER" >> "$GITHUB_ENV"
      - name: Bootstrap the test database (auth shim + schema + fixtures + publication)
        run: ./scripts/ci-db-bootstrap.sh
      - name: Test assigned workspaces serially
        run: node scripts/ci-lanes.mjs test

  check:
    # Stable aggregate gate for reviewers and deployment preflight. Missing/cancelled lanes fail.
    name: typecheck · test · build
    needs: [scope, validation, tests, public-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require all selected lanes
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
          CI_ONLY: ${{ needs.scope.outputs.ci_only }}
          CI_STATIC: ${{ needs.scope.outputs.ci_static }}
        run: node scripts/ci-lanes.mjs gate
  public-scan:
    name: public-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the history pass reads every commit

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tgz

      - name: Private patterns (from the optional secret)
        env:
          PUBLIC_SCAN_LOCAL: ${{ secrets.PUBLIC_SCAN_LOCAL }}
        run: |
          if [ -n "$PUBLIC_SCAN_LOCAL" ]; then printf '%s\n' "$PUBLIC_SCAN_LOCAL" > .public-scan.local; fi

      - name: Self-test the public tree list (the docs rule on a throwaway repository, then this one)
        run: bash scripts/public-tree.sh --self-test

      - name: Self-test the shared-config strip (every rule strips, and the check can fail)
        run: node scripts/public-config.mjs --self-test

      - name: Scan
        run: bash scripts/public-scan.sh
