# builds and pushes the nm-fleet operator image — keyless via WIF, same loud-skip
# contract as infra.yml. tags: the commit SHA always; `latest` only from main, followed
# by a rollout restart of the in-cluster Deployment (the v1 deploy knob — the image is
# :latest + Always until the canary ring lands).
name: fleet image

on:
  # the mirror (sync-from-public.yml) dispatches this after a mirrored push: a push made with
  # GITHUB_TOKEN triggers no workflow on its own, so the mirror names the ones the changed paths ask for
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - infra/images/fleet/**
      - .github/workflows/fleet-image.yml
      - packages/fleet/**
      - infra/k8s/templates/**
      - pnpm-lock.yaml
  pull_request:
    paths:
      - infra/images/fleet/**
      - .github/workflows/fleet-image.yml
      - packages/fleet/**

concurrency:
  group: fleet-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  IMAGE: us-east4-docker.pkg.dev/neuramesh-prd/nm/fleet

jobs:
  not-configured:
    name: "SKIPPED — WIF not configured (see infra/README.md bootstrap)"
    if: github.repository == 'alonge-dev/neuramesh' && vars.GCP_WIF_PROVIDER == ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::warning::fleet-image pipeline is NOT running — GCP_WIF_PROVIDER repo variable is unset."

  build-push:
    name: build + push ${{ github.event_name == 'pull_request' && '(sha tag only)' || '(sha + latest)' }}
    if: github.repository == 'alonge-dev/neuramesh' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF, keyless)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUSHER_SA }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-east4-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # repo-root context: the image carries packages/fleet + the k8s templates
          context: .
          file: infra/images/fleet/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.event_name == 'push' && format('{0}:latest', env.IMAGE) || '' }}

  roll:
    name: restart the in-cluster operator
    if: github.repository == 'alonge-dev/neuramesh' && vars.GCP_WIF_PROVIDER != '' && github.event_name == 'push'
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Restart nm-fleet on the new :latest
        run: |
          gcloud container clusters get-credentials nm-fleet --region us-east4 --project neuramesh-prd
          # a missing deployment is fine on the first roll — fleet-deploy.yml applies it
          if kubectl -n nm-system get deploy nm-fleet >/dev/null 2>&1; then
            kubectl -n nm-system rollout restart deploy/nm-fleet
            kubectl -n nm-system rollout status deploy/nm-fleet --timeout=300s
          else
            echo "::warning::nm-fleet deployment not found — apply infra/k8s/cluster/overlays/gke first (fleet-deploy.yml)"
          fi
