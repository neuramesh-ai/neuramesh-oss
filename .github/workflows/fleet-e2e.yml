# the fleet's proving ground in CI: every PR touching fleet logic or the manifests spins a
# throwaway k3d cluster and runs the reconciler's whole life (scripts/fleet-e2e.sh) — the
# same script that runs on a laptop. logic identical to GKE; isolation (gVisor) is not,
# and that difference is P0's job to verify, not this pipeline's.
name: fleet e2e

on:
  push:
    branches: [main]
    paths:
      - packages/fleet/**
      - infra/k8s/**
      - scripts/fleet-e2e.sh
      - .github/workflows/fleet-e2e.yml
  pull_request:
    paths:
      - packages/fleet/**
      - infra/k8s/**
      - scripts/fleet-e2e.sh
      - .github/workflows/fleet-e2e.yml

concurrency:
  group: fleet-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: reconcile against k3d
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install fleet deps
        run: pnpm install --filter @neuramesh/fleet

      - name: Unit tests
        run: pnpm --filter @neuramesh/fleet test

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash

      - name: Fleet e2e
        run: ./scripts/fleet-e2e.sh
