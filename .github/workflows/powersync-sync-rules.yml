name: powersync sync rules

# The PowerSync sync rules live ONCE, in dev/stack/powersync/sync-config.yaml (the dev stack mounts
# the same file). Prod was previously hand-edited in the PowerSync dashboard — the v0.5.0-class silent
# manual step. This validates the rules on every PR that touches them, and DEPLOYS them to the prod
# Cloud instance when they change on main, after applying DB migrations (so the schema the rules
# reference always exists first). Path-filtered, so the (heavy) reprocess only runs on a real rules change.
#
# One-time setup — add these in repo Settings -> Secrets and variables -> Actions:
#   PS_ADMIN_TOKEN          PowerSync personal access token (dashboard -> Account -> Access Tokens)
#   POWERSYNC_INSTANCE_ID   prod Cloud instance id (`powersync fetch instances`, or the dashboard URL)
#   SUPABASE_DB_URL         prod Postgres url (already used by the Vercel migrate step) — optional; when
#                           set, migrations are applied before the deploy
# Until PS_ADMIN_TOKEN + POWERSYNC_INSTANCE_ID exist the job no-ops with a notice (it never goes red).
on:
  # the mirror (sync-from-public.yml) dispatches this after a mirrored push: a push made with
  # GITHUB_TOKEN triggers no workflow on its own, so the mirror names the ones the changed paths ask for
  workflow_dispatch:
  pull_request:
    paths:
      - 'dev/stack/powersync/sync-config.yaml'
      - '.github/workflows/powersync-sync-rules.yml'
  push:
    branches: [main]
    paths:
      - 'dev/stack/powersync/sync-config.yaml'
      - '.github/workflows/powersync-sync-rules.yml'

concurrency:
  group: powersync-sync-rules
  cancel-in-progress: false

env:
  PS_CLI_VERSION: '0.10.0'
  RULES_FILE: dev/stack/powersync/sync-config.yaml

jobs:
  sync-rules:
    name: validate + deploy sync rules
    if: github.repository == 'alonge-dev/neuramesh'
    runs-on: ubuntu-latest
    env:
      PS_ADMIN_TOKEN: ${{ secrets.PS_ADMIN_TOKEN }}
      INSTANCE_ID: ${{ secrets.POWERSYNC_INSTANCE_ID }}
      HAS_SECRETS: ${{ secrets.PS_ADMIN_TOKEN != '' && secrets.POWERSYNC_INSTANCE_ID != '' }}
      HAS_DB: ${{ secrets.SUPABASE_DB_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if PowerSync secrets are not configured
        if: ${{ env.HAS_SECRETS != 'true' }}
        run: echo "::notice::PS_ADMIN_TOKEN / POWERSYNC_INSTANCE_ID not set — skipping PowerSync validate/deploy. Add them in repo Settings to enable."

      - name: Install Node
        if: ${{ env.HAS_SECRETS == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The CLI works against a project directory. Scaffold a scratch one, link it to the prod Cloud
      # instance, and drop in our canonical rules — the repo keeps ONE rules file (single source of truth).
      - name: Link prod instance + stage the rules
        if: ${{ env.HAS_SECRETS == 'true' }}
        run: |
          npx -y "powersync@${PS_CLI_VERSION}" init cloud --directory powersync
          npx -y "powersync@${PS_CLI_VERSION}" link cloud --instance-id="${INSTANCE_ID}" --directory powersync
          cp "${RULES_FILE}" powersync/sync-config.yaml

      # Apply DB migrations BEFORE validating (idempotent, advisory-locked) so the columns/tables the
      # rules reference exist first. This ordering is load-bearing: `validate` checks the rules against
      # the PROD schema, so a rule naming a table that a migration in this same merge introduces fails
      # validation unless the migration has already run. Validating first killed the job (set -e) and
      # skipped both the migrate and the deploy — the rules silently never shipped. Found on 0094, the
      # first change to add a NEW synced table since this workflow was written.
      # Vercel's control-api build also runs migrate.mjs, but that RACES this job; applying here makes
      # the ordering deterministic instead of hoping the deploy lands first.
      - name: Install pnpm
        if: ${{ env.HAS_SECRETS == 'true' && github.event_name == 'push' && env.HAS_DB == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - name: Apply DB migrations (schema before sync rules)
        if: ${{ env.HAS_SECRETS == 'true' && github.event_name == 'push' && env.HAS_DB == 'true' }}
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          pnpm install --frozen-lockfile --filter @neuramesh/control-api
          node packages/control-api/scripts/migrate.mjs --force

      # On a PULL REQUEST the prod DB is deliberately untouched, so a rule referencing a table this
      # branch's migration adds cannot validate yet — that's expected, not a defect in the rules. The
      # push-to-main run above migrates first and is the authoritative gate; here the result is advisory
      # so a legitimately-new table doesn't wedge the PR. Rule SYNTAX errors still surface in the log.
      - name: Validate sync rules
        if: ${{ env.HAS_SECRETS == 'true' }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: npx -y "powersync@${PS_CLI_VERSION}" validate --directory powersync --validate-only=sync-config

      - name: Deploy sync rules to the prod Cloud instance
        if: ${{ env.HAS_SECRETS == 'true' && github.event_name == 'push' }}
        run: npx -y "powersync@${PS_CLI_VERSION}" deploy sync-config --directory powersync --instance-id="${INSTANCE_ID}"
