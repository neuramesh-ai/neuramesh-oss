# Mobile (apps/mobile) release pipeline. The shared ci.yml already typechecks the
# app via `pnpm -r typecheck`; this workflow handles EAS Update (OTA) and store
# builds, which do NOT run per-PR (cost/latency). Requires the EXPO_TOKEN secret.
#
# Backend-before-mobile ordering is structural: the backend ships on merge to main
# (Vercel + auto-migrations) while mobile ships on a later `mobile-v*` tag / OTA, so
# landing the backend PR first IS the ordering. Mobile also feature-detects new
# endpoints (a 404 from /v1/devices just hides the push toggle).
name: mobile

on:
  # the mirror (sync-from-public.yml) dispatches this after a mirrored push: a push made with
  # GITHUB_TOKEN triggers no workflow on its own, so the mirror names the ones the changed paths ask for
  workflow_dispatch:
  push:
    branches: [main]
    # only mobile-directory changes trigger the OTA. Shared-package edits (client-core /
    # shared) reach mobile via its own bundle on the next apps/mobile change or a `mobile-v*`
    # tag — so a backend/desktop PR no longer fires (and reds) this pipeline. ci.yml still
    # typechecks the app on every PR via `pnpm -r typecheck`, so shared-dep breakage is caught.
    paths:
      - 'apps/mobile/**'
    tags:
      - 'mobile-v*'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ota:
    # push to main touching the app → ship a JS-only OTA update to the preview channel
    if: github.repository == 'alonge-dev/neuramesh' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS Update (preview)
        working-directory: apps/mobile
        run: eas update --channel preview --auto --non-interactive

  build:
    # tag mobile-vX.Y.Z → production build + store submission
    if: github.repository == 'alonge-dev/neuramesh' && startsWith(github.ref, 'refs/tags/mobile-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS build + submit (production)
        working-directory: apps/mobile
        run: eas build --profile production --platform ios --non-interactive --auto-submit
