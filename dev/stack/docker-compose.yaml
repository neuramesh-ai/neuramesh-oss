services:
  pg:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: nm
      POSTGRES_DB: nm
    volumes:
      # Fresh-DB bootstrap. The whole migrations + init tree is mounted and 00-bootstrap.sh applies
      # EVERY migration in order (auto-discovered) plus the storage DB + publication, recording
      # schema_migrations so the dev DB matches prod tracking. Replaces the old hand-listed mounts,
      # which rotted at 0042 — a fresh `docker compose up` now always lands on the latest schema.
      - ../../supabase:/bootstrap/supabase:ro
      - ./init:/bootstrap/init:ro
      - ./init/00-bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
    ports:
      - "127.0.0.1:55435:5432"
    healthcheck:
      # -h 127.0.0.1 forces TCP. During docker-entrypoint-initdb.d the image runs a
      # TEMPORARY socket-only server, so a socket psql reported healthy while
      # 00-bootstrap.sh was still applying the migration tree, allowing clients to
      # connect before their tables existed.
      # TCP answers only once the REAL server is up, which is after init completes.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U postgres -d nm -tAc 'select 1' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
