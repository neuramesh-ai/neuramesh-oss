<!DOCTYPE html>
<!--
  The web icons (apple-touch-icon, the manifest's 192 and 512), rendered by og/render.mjs.
  The same picture as the Mac app icon (apps/desktop/build/icon.svg): Porch on the cream tile,
  oak #834a2b with the top sheen and the bottom shade. Full bleed and opaque, because iOS fills
  transparent corners with black and Android masks its own shape (the mark sits inside the
  80% safe zone).
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body { background: linear-gradient(#fff7ee, #f0e2cd); display: grid; place-items: center; }
  svg { width: 348px; height: 348px; display: block; }
</style>
</head>
<body>
  <svg viewBox="0 0 48 48" aria-hidden>
    <defs>
      <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0.26" />
        <stop offset="0.5" stop-color="#fff" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0.4" stop-color="#000" stop-opacity="0" />
        <stop offset="1" stop-color="#000" stop-opacity="0.24" />
      </linearGradient>
    </defs>
    <path d="M6.5 22 C6.5 11 14 4.5 24 4.5 C34 4.5 41.5 11 41.5 22 L41.5 38.5 C41.5 41.8 39.3 43.5 36.5 43.5 L11.5 43.5 C8.7 43.5 6.5 41.8 6.5 38.5 Z" fill="#834a2b" />
    <path d="M6.5 22 C6.5 11 14 4.5 24 4.5 C34 4.5 41.5 11 41.5 22 L41.5 38.5 C41.5 41.8 39.3 43.5 36.5 43.5 L11.5 43.5 C8.7 43.5 6.5 41.8 6.5 38.5 Z" fill="url(#sheen)" />
    <path d="M6.5 22 C6.5 11 14 4.5 24 4.5 C34 4.5 41.5 11 41.5 22 L41.5 38.5 C41.5 41.8 39.3 43.5 36.5 43.5 L11.5 43.5 C8.7 43.5 6.5 41.8 6.5 38.5 Z" fill="url(#shade)" />
    <circle cx="18.4" cy="21.5" r="2.75" fill="#fff7ee" />
    <circle cx="29.6" cy="21.5" r="2.75" fill="#fff7ee" />
    <path d="M17.6 28.4 C20.3 32.8 27.7 32.8 30.4 28.4" fill="none" stroke="#fff7ee" stroke-width="2.9" stroke-linecap="round" />
  </svg>
</body>
</html>
