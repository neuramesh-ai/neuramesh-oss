<!DOCTYPE html>
<!--
  The social card (Open Graph + X summary_large_image), 1200×630, on the Foundry system.
  Render with `node og/render.mjs` (a real Chromium via the desktop's Electron, so the fonts
  are the site's own). ?theme=dark renders the graphite variant for comparison. The copy
  mirrors src/copy.ts HERO by hand: the card is a picture, so the copy gate cannot read it.
  Change the words there first, then here, then re-render.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: 'NeuraMesh Sans'; font-weight: 100 900; src: url('../node_modules/@neuramesh/fonts/files/neuramesh-sans-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Geist Mono Variable'; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Bricolage Grotesque Variable'; font-weight: 200 800; src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2'); }
  :root {
    --paper: #f5f4f2; --ink: #0c0b0a; --body: #57534e; --muted: #6b665f; --line: #dedbd6;
    --accent: #834a2b; --grid: rgba(12, 11, 10, .07); --glow: rgba(131, 74, 43, .14);
  }
  [data-bt='dark'] {
    --paper: #0d0d0d; --ink: #e8e6e3; --body: #a8a29e; --muted: #8a857e; --line: #262626;
    --accent: #c58a63; --grid: rgba(232, 230, 227, .07); --glow: rgba(197, 138, 99, .16);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; background-color: var(--paper); color: var(--ink);
    font-family: 'NeuraMesh Sans', -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px; background-position: 20px 20px;
  }
  body::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 70% at 78% 0%, var(--glow), transparent 70%); }
  .card { position: relative; height: 100%; padding: 60px 68px 56px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .lockup { display: flex; align-items: center; gap: 14px; }
  .wm { font: 600 36px/1 'Bricolage Grotesque Variable', sans-serif; letter-spacing: -.015em; color: var(--ink); }
  .site { font: 500 17px 'Geist Mono Variable', monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .k { margin-top: 26px; font: 400 20px 'Geist Mono Variable', monospace; letter-spacing: .12em; word-spacing: .4em; text-transform: uppercase; color: var(--muted); }
  h1 { margin-top: 64px; font-size: 104px; font-weight: 500; line-height: .96; letter-spacing: -.045em; text-transform: uppercase; color: var(--ink); }
  .lead { margin-top: 30px; font-size: 27px; line-height: 1.35; color: var(--body); max-width: 900px; text-wrap: pretty; }
  .facts { margin-top: auto; display: flex; align-items: center; gap: 18px; font: 500 16px 'Geist Mono Variable', monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .facts i { width: 1px; height: 14px; background: var(--line); }
</style>
<script>
  try { var t = new URLSearchParams(location.search).get('theme'); if (t === 'dark') document.documentElement.setAttribute('data-bt', 'dark'); } catch (e) {}
</script>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="lockup">
        <svg width="54" height="54" viewBox="0 0 48 48" aria-hidden>
          <path d="M6.5 22 C6.5 11 14 4.5 24 4.5 C34 4.5 41.5 11 41.5 22 L41.5 38.5 C41.5 41.8 39.3 43.5 36.5 43.5 L11.5 43.5 C8.7 43.5 6.5 41.8 6.5 38.5 Z" fill="#834a2b" />
          <circle cx="18.4" cy="21.5" r="2.75" fill="#fff7ee" />
          <circle cx="29.6" cy="21.5" r="2.75" fill="#fff7ee" />
          <path d="M17.6 28.4 C20.3 32.8 27.7 32.8 30.4 28.4" fill="none" stroke="#fff7ee" stroke-width="2.9" stroke-linecap="round" />
        </svg>
        <span class="wm">neuramesh</span>
      </div>
      <div class="site">neuramesh.app</div>
    </div>
    <h1>From ask to done<br />in minutes.</h1>
    <div class="k">The fast way to run a company with agents</div>
    <p class="lead">Vetted expert agents on fast models finish real work. Another agent checks it. You approve what goes out.</p>
    <div class="facts"><span>500 free credits</span><i></i><span>No install</span><i></i><span>No key</span><i></i><span>No card</span></div>
  </div>
</body>
</html>
