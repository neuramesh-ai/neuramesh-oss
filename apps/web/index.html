  <script>
    // Theme follows the OS; a ?bt=dark|light URL param overrides (screenshots/demos).
    // Runs before paint so there is no flash before React mounts.
    try {
      var nmBt = new URLSearchParams(location.search).get('bt');
      if (nmBt !== 'dark' && nmBt !== 'light') nmBt = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-bt', nmBt);
    } catch (e) {}
  </script>
