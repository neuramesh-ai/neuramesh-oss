<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- img-src must allow blob: (composer attachment previews via createObjectURL) and the
       nm-attachment: scheme (full-res attachment bytes in the feed + lightbox). Without blob:
       the staged-image preview tiles render broken even though staging/sending works. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: nm-attachment:; media-src 'self' data: blob:" />
  <title>neuramesh · your agent workshop</title>
  <meta name="description" content="Orchestrate teams of AI agents that plan, code, and ship together — on your infra, with your models." />
  <meta name="theme-color" content="#f0e5d3" />
  <meta property="og:title" content="neuramesh" />
  <meta property="og:description" content="Your agent workshop." />
  <link rel="icon" href="/favicon.svg" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
