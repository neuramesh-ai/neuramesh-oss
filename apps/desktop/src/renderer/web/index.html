    <!-- THE THEME, BEFORE THE FIRST PAINT. App.tsx applies the same rule (theme/theme.ts) when its
         module runs, which on a slow link is seconds in: until then a light theme showed the dark
         default. The same four ids, the same 'system' rule, the same key. -->
    <script>
      (function () {
        try {
          var ls = window.localStorage, d = document.documentElement;
          var pref = ls.getItem('nm:theme') || 'system';
          if (!/^(dark|light|soft-dark|cream-oak|system)$/.test(pref)) pref = 'system';
          d.dataset.theme = pref === 'system' ? (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref;
          // THE STATIC SHELL (below) is for a signed-in person on Home in the default layout: the
          // same person the shell will open for. Anyone else gets the page as it was.
          var user = null;
          try { user = JSON.parse(ls.getItem('nm:web:user') || 'null'); } catch (e) { user = null; }
          var dev = '%VITE_NM_DEV_USER%';
          if (dev.charAt(0) === '%') dev = '';
          if (!(user && user.id) && !dev) return;
          if ((ls.getItem('nm:navPos') || 'left') !== 'left' || ls.getItem('nm:navFolded') === '1' || ls.getItem('nm:navMode') === 'code') return;
          if (new URLSearchParams(location.search).get('view')) return;
          d.setAttribute('data-nm-static', '');
          window.__nmStaticBoot = { email: user && user.email ? String(user.email) : dev ? 'dev@local' : '' };
        } catch (e) { /* no storage: no static shell, the page as it was */ }
      })();
    </script>
    <style>
      /* shown only once its script has filled it: a page can paint between the markup and the script */
      #nm-static { display: none; }
      html[data-nm-static][data-nm-static-ready] #nm-static { display: block; position: fixed; inset: 0; z-index: 300; }
      #nm-static [data-nm-hold] { visibility: hidden; }
      /* nothing here moves: a style that lands late must not play a transition on the way in */
      #nm-static, #nm-static * { transition: none !important; }
    </style>
    <!-- The Porch mark, the same asset the marketing site serves (apps/web/public/favicon.svg) —
         copied rather than re-drawn so the tab and the landing page can never diverge. SVG first
         for modern browsers; the 32px PNG is the fallback for the ones that ignore it. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- the browser paints its own chrome behind the app; graphite, so a light-mode browser does
         not flash white around a dark shell -->
    <meta name="theme-color" content="#141414" />

el="Collapse threads"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button><button type="button" class="navgrphdlbl door" aria-pressed="false">Recents</button><span class="navgrphdsep" aria-hidden="true">·</span><button type="button" class="navgrphdlbl on" aria-pressed="true">Projects</button><span class="navgrphdcnt" data-nm-cold="">0</span><span class="navscopegrow"></span><button type="button" class="chanadd navhistfind" aria-label="Search every thread"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.3-4.3"></path></svg></button></div><div class="navhistlist"><div class="navhistempty" data-nm-cold="">No threads yet</div><div class="navhistempty" data-nm-cold="">No threads yet</div></div></div></div></div></div><div class="navwsfoot" data-nm-needs="ws"><button type="button" class="navwsmain" aria-expanded="false"><span class="navwstile" aria-hidden="true" data-nm-slot="wsinitial">A</span><span class="navwsname" data-nm-slot="ws">Acme Robotics</span><span class="navwscar" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></button></div></nav><div class="navgrip" role="separator" aria-orientation="vertical" aria-label="Resize the sidebar" aria-valuenow="320" aria-valuemin="224" aria-valuemax="356" tabindex="0" inert=""><span class="navgripbar" aria-hidden="true"></span></div><div class="shellbody"><div class="main"><div class="wtstrip sheethd bare" inert=""><div class="wtright"><span class="bellwrap"><button class="bellbtn" aria-expanded="false" aria-label="Needs you d="M12 21v-7"></path><path d="M12 14c0-3.5-5-3.5-5-7.5"></path><path d="M12 14c0-3.5 5-3.5 5-7.5"></path><path d="M4.5 9 7 6.5 9.5 9"></path><path d="M14.5 9 17 6.5 19.5 9"></path></svg></span><span class="lbl">Auto</span><span class="car" aria-hidden="true">▾</span></button></div><div class="cchips" data-nm-needs="brain"><button class="cchip"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5a3 3 0 0 0-3 3.1c-1.8.4-3.1 1.9-3.1 3.8a3.9 3.9 0 0 0 1.5 3.1 3.4 3.4 0 0 0 3.3 4.4c.4 0 .9-.1 1.3-.2.4.1.9.2 1.3.2a3.4 3.4 0 0 0 3.3-4.4 3.9 3.9 0 0 0 1.5-3.1c0-1.9-1.3-3.4-3.1-3.8a3 3 0 0 0-3-3.1z"></path><path d="M12 4.5v15"></path></svg><span class="lbl" data-nm-slot="brain">Brain · Claude Core</span><span class="car">▾</span></button></div><button type="button" class="attachbtn" aria-label="Mention a teammate"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.6"></circle><path d="M15.6 8.4v4.9a2.6 2.6 0 0 0 5.2 0V12a8.8 8.8 0 1 0-3.5 7"></path></svg></button><input multiple="" type="file" style="display: none;"><button type="button" class="attachbtn" aria-label="Attach images or files"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg></button><span style="flex: 1 1 0%;"></span><button class="hsend" disabled="" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg></button></div><div class="cfoot" inert=""><div class="cfootpills" aria-hidden="false"><button type="button" class="cfootpill" tabindex="0">Give me ideas</button><button type="button" class="cfootpill" tabindex="0">What moved while I was away?</button><button type="button" class="cfootpill" tabindex="0">Plan the next release</button></div></div></div></div></div></div></div></div></div></div></div></div>
    <script>
      (function () {
        var d = document.documentElement, root = document.getElementById('nm-static');
        if (!d.hasAttribute('data-nm-static')) { root.remove(); return; }
        var boot = window.__nmStaticBoot || {}, facts = null;
        try { facts = JSON.parse(localStorage.getItem('nm:web:shellFacts') || 'null'); } catch (e) { facts = null; }
        var slot = function (n) { return root.querySelector('[data-nm-slot="' + n + '"]'); };
        var set = function (n, t) { var el = slot(n); if (el) el.textContent = t; };
        var now = new Date(), h = now.getHours();
        set('date', now.toLocaleDateString([], { weekday: 'long' }) + ' \u00b7 ' + now.toLocaleDateString([], { month: 'short', day: 'numeric' }));
        // the greeting App draws before the member list syncs: the email's name (lib/self.ts)
        var local = (boot.email || '').split('@')[0] || '';
        var label = local.replace(/[._-]+/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
        var name = facts ? facts.name : (label.split(/\s+/)[0] || null);
        if (name === 'you') name = null;
        // the same text nodes React writes ({hello}{', ' + name}.), so the line shapes the same way
        var hi = slot('hello');
        [h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening', name ? ', ' + name : '', '.'].forEach(function (t) { if (t) hi.parentNode.insertBefore(document.createTextNode(t), hi); });
        hi.remove();
        set('project', facts && facts.project || '\u2026');
        set('room', facts && facts.room || '\u2026');
        var needs = root.querySelectorAll('[data-nm-needs]');
        for (var i = 0; i < needs.length; i++) {
          var key = needs[i].getAttribute('data-nm-needs');
          if (!(facts && facts[key])) needs[i].style.visibility = 'hidden';
        }
        if (facts) {
          set('brain', facts.brain || '');
          set('ws', facts.ws || '');
          set('wsinitial', (facts.ws || '').trim().charAt(0).toUpperCase());
          if (facts.ledgered) {
            slot('stage').classList.add('ledgered');
            // the app's column scrolled last time: keep its scrollbar's width, so the column sits where React puts it
            if (facts.scroll) slot('stage').style.overflowY = 'scroll';
          }
          var cold = root.querySelectorAll('[data-nm-cold]');
          for (var j = 0; j < cold.length; j++) cold[j].style.display = 'none';
        }
        var nw = Number(localStorage.getItem('nm:navw'));
        var nav = root.querySelector('.navpanel');
        if (nav && nw > 0) nav.style.setProperty('--nm-navw', Math.max(224, Math.min(356, Math.round(nw))) + 'px');
        var ta = root.querySelector('[data-nm-static-composer]');
        var foot = root.querySelector('.cfoot'), send = root.querySelector('.hsend'), hl = root.querySelector('.chl');
        ta.addEventListener('input', function () {
          // what React's composer does as you type. Its textarea is transparent and the text shows in
          // the backdrop behind it (ComposerInput: the text, then a zero-width tail), so the backdrop
          // carries the text here too. The pills step aside, Send wakes, the box grows.
          if (hl) { hl.textContent = ta.value + '\u200b'; hl.scrollTop = ta.scrollTop; }
          if (foot) foot.classList.toggle('drafting', !!ta.value);
          if (send) send.disabled = !ta.value.trim();
          ta.style.height = 'auto';
          ta.style.height = Math.max(40, ta.scrollHeight) + 'px';
        });
        // Enter sends in the real composer; here it only keeps the text (Shift+Enter is a new line)
        ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) e.preventDefault(); });
        var release = function () { if (root.isConnected) root.remove(); d.removeAttribute('data-nm-static'); d.removeAttribute('data-nm-static-ready'); };
        window.__nmStaticShell = {
          draft: function () { return root.isConnected ? { value: ta.value, start: ta.selectionStart, end: ta.selectionEnd, focused: document.activeElement === ta } : null; },
          release: release,
        };
        // a boot that fails must show what it shows today, never a composer that goes nowhere
        window.addEventListener('error', release);
        window.addEventListener('unhandledrejection', release);
        d.setAttribute('data-nm-static-ready', '');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
