<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Mirror the real app's img-src so attachment-preview shots actually exercise the CSP
       (Slice 5 missed a blob: regression because this harness had no CSP). img-src only —
       other directives stay open so the Vite harness isn't constrained. -->
  <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob: nm-attachment:" />
  <title>NeuraMesh — preview harness</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/main.tsx"></script>
</body>
</html>
