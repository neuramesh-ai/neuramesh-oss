<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>oss-release-2026-09 · design canvas</title>
<style>
  html, body { margin: 0; background: #e9e6e1; color: #333; font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .bar { position: fixed; top: 0; left: 0; right: 0; height: 40px; background: #fff; border-bottom: 1px solid #d6d2cc; display: flex; align-items: center; gap: 14px; padding: 0 16px; z-index: 10; }
  .bar b { font-weight: 600; }
  .bar select { font: inherit; }
  .canvas { position: relative; transform-origin: 0 0; margin: 60px 20px 40px; }
  .art { position: absolute; }
  .art .t { position: absolute; top: -22px; left: 0; font: 500 11px ui-monospace, Menlo, monospace; color: #555; white-space: nowrap; letter-spacing: -.01em; }
  .art iframe { border: 1px solid #cfcac3; border-radius: 6px; background: #fff; display: block; }
  .note { position: absolute; font-size: 13px; line-height: 1.5; color: #333; white-space: pre-wrap; background: #fff8ee; border: 1px solid #e3d6c3; border-radius: 6px; padding: 12px 14px; }
</style>
</head>
<body>
<div class="bar"><b>oss-release-2026-09</b><span>Free is the local desktop app, Pro is the cloud · design canvas</span><span style="flex:1"></span><label>Zoom <select id="z"><option value="0.5">50%</option><option value="0.67">67%</option><option value="0.75" selected>75%</option><option value="1">100%</option></select></label></div>
<div class="canvas" id="c"></div>
<script>
fetch('./canvas.json').then(r => r.json()).then(c => {
  const el = document.getElementById('c');
  let minY = 0, maxX = 0, maxY = 0;
  for (const n of c.annotations) minY = Math.min(minY, n.y);
  const off = -minY + 20;
  for (const a of c.artboards) {
    const d = document.createElement('div'); d.className = 'art'; d.style.cssText = `left:${a.x}px;top:${a.y + off}px;width:${a.w}px;height:${a.h}px`;
    d.innerHTML = `<span class="t">${a.title}</span><iframe src="./${a.file}" width="${a.w}" height="${a.h}" loading="lazy"></iframe>`;
    el.appendChild(d); maxX = Math.max(maxX, a.x + a.w); maxY = Math.max(maxY, a.y + a.h + off);
  }
  for (const n of c.annotations) {
    const d = document.createElement('div'); d.className = 'note'; d.style.cssText = `left:${n.x}px;top:${n.y + off}px;width:${n.w}px`; d.textContent = n.text; el.appendChild(d);
  }
  el.style.width = maxX + 'px'; el.style.height = maxY + 'px';
  const z = document.getElementById('z'); const apply = () => { el.style.transform = `scale(${z.value})`; document.body.style.height = (maxY * z.value + 120) + 'px'; }; z.onchange = apply; apply();
});
</script>
</body>
</html>
